services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reconstruction
      POSTGRES_USER: reconstruction
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconstruction"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build: .
    command: uvicorn control_plane.main:app --host 0.0.0.0 --port 8000
    environment:
      CONTROL_DATABASE_URL: postgresql+psycopg://reconstruction:local-development-only@postgres/reconstruction
      CONTROL_UPLOAD_TOKEN_SECRET: local-shared-secret
      CONTROL_INTERNAL_API_KEY: local-internal-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  transfer-1:
    build: .
    command: uvicorn transfer_node.main:app --host 0.0.0.0 --port 8100
    environment:
      TRANSFER_NODE_ID: transfer-1
      TRANSFER_PUBLIC_URL: http://localhost:8101
      TRANSFER_CALLBACK_URL: http://transfer-1:8100
      TRANSFER_CONTROL_PLANE_URL: http://control-plane:8000
      TRANSFER_UPLOAD_TOKEN_SECRET: local-shared-secret
      TRANSFER_INTERNAL_API_KEY: local-internal-key
      TRANSFER_COMPUTE_NODES: compute-1|http://compute-1:8200|1
    ports:
      - "8101:8100"
    volumes:
      - transfer-1-data:/app/data/transfer-1
    depends_on:
      - control-plane

  transfer-2:
    build: .
    command: uvicorn transfer_node.main:app --host 0.0.0.0 --port 8100
    environment:
      TRANSFER_NODE_ID: transfer-2
      TRANSFER_PUBLIC_URL: http://localhost:8102
      TRANSFER_CALLBACK_URL: http://transfer-2:8100
      TRANSFER_CONTROL_PLANE_URL: http://control-plane:8000
      TRANSFER_UPLOAD_TOKEN_SECRET: local-shared-secret
      TRANSFER_INTERNAL_API_KEY: local-internal-key
      TRANSFER_COMPUTE_NODES: compute-1|http://compute-1:8200|1
    ports:
      - "8102:8100"
    volumes:
      - transfer-2-data:/app/data/transfer-2
    depends_on:
      - control-plane

  compute-1:
    build: .
    command: uvicorn compute_node.main:app --host 0.0.0.0 --port 8200
    environment:
      COMPUTE_NODE_ID: gpu-1
      COMPUTE_INTERNAL_API_KEY: local-internal-key
      COMPUTE_STORAGE_ROOT: /app/data/compute-1
      COMPUTE_CAPACITY: 1
    ports:
      - "8200:8200"
    volumes:
      - compute-1-data:/app/data/compute-1

volumes:
  postgres-data:
  transfer-1-data:
  transfer-2-data:

  compute-1-data:
