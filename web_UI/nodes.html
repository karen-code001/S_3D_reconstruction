<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="查看中转节点与计算节点的运行状态" />
  <title>节点状态</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./plants.css" />
  <link rel="stylesheet" href="./nodes.css" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="返回任务中心"><span class="brand-mark">3D</span><span><strong>三维重建</strong><small>节点状态</small></span></a>
    <nav class="topbar-actions"><a class="ghost-button" href="./index.html">返回任务中心</a></nav>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">NODE STATUS</p>
      <h1>节点<span>状态</span></h1>
      <p class="hero-copy">查看中转节点和计算节点的运行情况。中转节点每 5 秒刷新，计算节点每 10 秒刷新。</p>
    </section>
    <section class="nodes-grid" aria-label="节点状态列表">
      <article class="panel recent-panel">
        <div class="recent-heading"><h2>中转节点</h2><span id="nodeSummary" class="muted"></span></div>
        <div id="transferNodes" class="recent-list"><p class="muted">加载中…</p></div>
      </article>
      <article class="panel recent-panel">
        <div class="recent-heading"><h2>计算节点</h2><span id="computeSummary" class="muted"></span></div>
        <label class="compute-filter" for="computeTransferFilter">中转节点
          <select id="computeTransferFilter"><option value="">正在加载分组…</option></select>
        </label>
        <div id="computeNodes" class="recent-list"><p class="muted">加载中…</p></div>
      </article>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer>三维重建服务 · 节点状态</footer>
  <script src="./nodes.js"></script>
</body>
</html>
